# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: zavastorefront
metadata:
  template: zavastorefront@0.0.1-beta

services:
  zavastorefront:
    project: ./src
    language: dotnet
    host: appservice

hooks:
  preprovision:
    windows:
      shell: pwsh
      run: echo "Preparing to provision Azure resources..."
      continueOnError: false
    posix:
      shell: sh
      run: echo "Preparing to provision Azure resources..."
      continueOnError: false
  
  postprovision:
    windows:
      shell: pwsh
      run: echo "Azure resources provisioned successfully"
      continueOnError: false
    posix:
      shell: sh
      run: echo "Azure resources provisioned successfully"
      continueOnError: false